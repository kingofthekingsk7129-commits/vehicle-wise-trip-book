
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Nandhi Trip Book</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4f8;color:#172033;font-family:Arial,sans-serif}
header{background:#102b4e;color:white;padding:20px 12px;text-align:center}
header h2{margin:0 0 8px}
header p{margin:0;font-size:13px}
main{max-width:900px;margin:auto;padding:12px}
.card{background:white;border-radius:13px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000012}
h3{margin-top:0;color:#163b65}
label{display:block;margin:12px 0 5px;font-size:14px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:8px;font-size:16px;background:white}
button{border:0;border-radius:8px;padding:12px;background:#205c9a;color:white;font-weight:bold;font-size:15px;cursor:pointer;margin-top:8px}
.green{background:#16834b}
.red{background:#c0392b}
.gray{background:#596579}
.orange{background:#e78a19}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#eaf2ff;border-radius:10px;padding:13px}
.stat small{display:block;color:#53657c}
.stat b{display:block;font-size:21px;margin-top:5px}
.formgrid{display:grid;grid-template-columns:1fr;gap:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{flex:1}
.vehicle{border:1px solid #dce3ed;border-radius:10px;padding:12px;margin-top:10px}
.trip{border:1px solid #dce3ed;border-radius:10px;padding:12px;margin-top:10px}
.trip p{margin:5px 0;font-size:14px}
.profit{color:#16834b;font-weight:bold}
.loss{color:#c0392b;font-weight:bold}
.muted{font-size:12px;color:#65748a}
hr{border:0;border-top:1px solid #eee;margin:15px 0}
@media(min-width:650px){
 .stats{grid-template-columns:repeat(4,1fr)}
 .formgrid{grid-template-columns:1fr 1fr;gap:0 12px}
}
</style>
</head>
<body>

<header>
<h2>🚛 SRI NANDHI CARGO MOVERS</h2>
<p>VEHICLE WISE TRIP BOOK</p>
</header>

<main>

<div class="card">
<h3>📊 Dashboard</h3>
<div class="stats">
<div class="stat"><small>Total Vehicles</small><b id="vehicleCount">0</b></div>
<div class="stat"><small>Total Trips</small><b id="tripCount">0</b></div>
<div class="stat"><small>Total Rent</small><b id="totalRent">₹0</b></div>
<div class="stat"><small>Net Profit</small><b id="totalProfit">₹0</b></div>
</div>
<p id="cloudStatus" class="muted">Local storage ready</p>
</div>

<div class="card">
<h3>➕ Add Vehicle</h3>
<label>Vehicle Number</label>
<input id="newVehicle" placeholder="TN 39 AB 1234">
<button onclick="addVehicle()">Add Vehicle</button>
</div>

<div class="card">
<h3>🚚 Vehicle List</h3>
<div id="vehicleList"></div>
</div>

<div class="card">
<h3>📝 Trip Entry</h3>

<label>Select Vehicle</label>
<select id="vehicleSelect"></select>

<div class="formgrid">
<div><label>Date</label><input type="date" id="date"></div>
<div><label>Trip Number</label><input id="tripNo" placeholder="Trip number"></div>
<div><label>Driver Name</label><input id="driver" placeholder="Driver name"></div>
<div><label>From</label><input id="from" placeholder="Starting place"></div>
<div><label>To</label><input id="to" placeholder="Destination"></div>
<div><label>Rent Amount ₹</label><input type="number" id="rent" value="0"></div>
<div><label>Diesel Amount ₹</label><input type="number" id="diesel" value="0"></div>
<div><label>Toll Amount ₹</label><input type="number" id="toll" value="0"></div>
<div><label>Other Expenses ₹</label><input type="number" id="other" value="0"></div>
<div><label>Driver Salary ₹</label><input type="number" id="salary" value="0"></div>
<div><label>Driver Advance ₹</label><input type="number" id="advance" value="0"></div>
<div><label>KM Travelled</label><input type="number" id="km" value="0"></div>
</div>

<button class="green" onclick="saveTrip()">💾 Save Trip</button>
<button class="gray" onclick="clearForm()">Clear Form</button>
</div>

<div class="card">
<h3>🔎 Trip History</h3>
<label>Search Vehicle Number / Driver / Route</label>
<input id="search" placeholder="Search..." oninput="renderHistory()">

<div class="actions">
<button onclick="printReport()">📄 PDF / Print</button>
<button class="orange" onclick="backupData()">⬇ Backup</button>
</div>

<label>Restore Backup</label>
<input type="file" id="restoreFile" accept=".json">
<button class="gray" onclick="restoreData()">Restore</button>

<div id="history"></div>
</div>
</main>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* Firebase configuration
   Replace with your Firebase Web App config.
*/
const firebaseConfig={
 apiKey:"YOUR_API_KEY",
 authDomain:"sri-nandhi-trip-book.firebaseapp.com",
 projectId:"sri-nandhi-trip-book",
 storageBucket:"sri-nandhi-trip-book.firebasestorage.app",
 messagingSenderId:"936453582782",
 appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const $=id=>document.getElementById(id);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let data={vehicles:[],trips:[]};
let editId=null;
let cloudReady=false;
let saveTimer=null;

$("date").value=new Date().toISOString().slice(0,10);

/* Firebase login & load */
async function connectFirebase(){
 try{
  await signInAnonymously(auth);
  cloudReady=true;
  $("cloudStatus").textContent="☁️ Firebase connected";

  const snap=await getDoc(doc(db,"tripbooks","sri-nandhi"));
  if(snap.exists()){
   const cloud=snap.data();
   if(Array.isArray(cloud.vehicles))data.vehicles=cloud.vehicles;
   if(Array.isArray(cloud.trips))data.trips=cloud.trips;
   localStorage.setItem("sriNandhiTripBook",JSON.stringify(data));
  }else{
   const local=localStorage.getItem("sriNandhiTripBook");
   if(local){
    data=JSON.parse(local);
    await setDoc(doc(db,"tripbooks","sri-nandhi"),data);
   }
  }
  render();
 }catch(err){
  cloudReady=false;
  $("cloudStatus").textContent="⚠️ Firebase error. Local save active.";
  console.error(err);
 }
}

/* Save locally + cloud */
function saveData(){
 localStorage.setItem("sriNandhiTripBook",JSON.stringify(data));
 if(cloudReady){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
   try{
    await setDoc(doc(db,"tripbooks","sri-nandhi"),data);
    $("cloudStatus").textContent="☁️ Online data saved";
   }catch(e){
    $("cloudStatus").textContent="⚠️ Cloud save failed. Local data saved.";
    console.error(e);
   }
  },500);
 }
}

/* Vehicles */
function addVehicle(){
 const v=$("newVehicle").value.trim().toUpperCase();
 if(!v)return alert("Enter vehicle number");
 if(data.vehicles.includes(v))return alert("Vehicle already exists");
 data.vehicles.push(v);
 $("newVehicle").value="";
 saveData();
 render();
}

function removeVehicle(v){
 if(!confirm("Delete vehicle "+v+"?"))return;
 if(data.trips.some(t=>t.vehicle===v))
  return alert("This vehicle has trips. Delete those trips first.");
 data.vehicles=data.vehicles.filter(x=>x!==v);
 saveData();
 render();
}

/* Form */
function clearForm(){
 editId=null;
 ["tripNo","driver","from","to","rent","diesel","toll","other","salary","advance","km"]
 .forEach(id=>$(id).value="");
 $("date").value=new Date().toISOString().slice(0,10);
}

function saveTrip(){
 const vehicle=$("vehicleSelect").value;
 const date=$("date").value;
 const driver=$("driver").value.trim();
 const from=$("from").value.trim();
 const to=$("to").value.trim();

 if(!vehicle)return alert("Please add/select a vehicle");
 if(!date||!driver||!from||!to)return alert("Fill Date, Driver, From and To");

 const rent=Number($("rent").value||0);
 const diesel=Number($("diesel").value||0);
 const toll=Number($("toll").value||0);
 const other=Number($("other").value||0);
 const salary=Number($("salary").value||0);
 const advance=Number($("advance").value||0);
 const km=Number($("km").value||0);

 const expenses=diesel+toll+other+salary+advance;
 const profit=rent-expenses;

 const trip={
  id:editId||("trip-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)),
  vehicle,date,tripNo:$("tripNo").value.trim(),
  driver,from,to,rent,diesel,toll,other,salary,advance,km,profit
 };

 if(editId){
  data.trips=data.trips.map(t=>t.id===editId?trip:t);
 }else{
  data.trips.push(trip);
 }

 editId=null;
 saveData();
 clearForm();
 render();
 alert("Trip saved successfully!");
}

/* Vehicle selector */
function selectChanged(){
 renderHistory();
}

function render(){
 $("vehicleCount").textContent=data.vehicles.length;
 $("tripCount").textContent=data.trips.length;
 $("totalRent").textContent=money(data.trips.reduce((s,t)=>s+Number(t.rent||0),0));
 $("totalProfit").textContent=money(data.trips.reduce((s,t)=>s+Number(t.profit||0),0));

 const sel=$("vehicleSelect");
 const old=sel.value;
 sel.innerHTML='<option value="">Select Vehicle</option>'+
 data.vehicles.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
 if(data.vehicles.includes(old))sel.value=old;

 $("vehicleList").innerHTML=data.vehicles.length?
 data.vehicles.map(v=>{
  const count=data.trips.filter(t=>t.vehicle===v).length;
  const total=data.trips.filter(t=>t.vehicle===v).reduce((s,t)=>s+Number(t.profit||0),0);
  return `<div class="vehicle">
   <b>${esc(v)}</b>
   <p class="muted">${count} Trips | Net Profit: ${money(total)}</p>
   <button class="red" onclick="removeVehicle('${esc(v)}')">Delete Vehicle</button>
  </div>`;
 }).join(""):'<p class="muted">No vehicles added yet.</p>';

 renderHistory();
}

function renderHistory(){
 const q=$("search").value.trim().toUpperCase();
 const list=data.trips.filter(t=>{
  return !q||[t.vehicle,t.driver,t.from,t.to,t.tripNo]
   .some(x=>String(x||"").toUpperCase().includes(q));
 }).sort((a,b)=>b.date.localeCompare(a.date));

 $("history").innerHTML=list.length?list.map(t=>{
  const p=Number(t.profit||0);
  return `<div class="trip">
   <b>${esc(t.vehicle)} | ${esc(t.tripNo||"Trip")}</b>
   <p>📅 ${esc(t.date)}</p>
   <p>👨‍✈️ Driver: ${esc(t.driver)}</p>
   <p>📍 ${esc(t.from)} → ${esc(t.to)}</p>
   <p>Rent: ${money(t.rent)}</p>
   <p>Diesel: ${money(t.diesel)} | Toll: ${money(t.toll)} | Other: ${money(t.other)}</p>
   <p>Salary: ${money(t.salary)} | Advance: ${money(t.advance)}</p>
   <p>KM: ${esc(t.km||0)}</p>
   <p class="${p>=0?'profit':'loss'}">Net Profit: ${money(p)}</p>
   <div class="actions">
   <button onclick="editTrip('${t.id}')">✏️ Edit</button>
   <button class="red" onclick="deleteTrip('${t.id}')">🗑 Delete</button>
   </div>
  </div>`;
 }).join(""):'<p class="muted">No trip records found.</p>';
}

function editTrip(id){
 const t=data.trips.find(x=>x.id===id);
 if(!t)return;
 if(!confirm("Edit this trip?"))return;
 editId=id;
 $("vehicleSelect").value=t.vehicle;
 $("date").value=t.date;
 $("tripNo").value=t.tripNo||"";
 $("driver").value=t.driver||"";
 $("from").value=t.from||"";
 $("to").value=t.to||"";
 $("rent").value=t.rent||0;
 $("diesel").value=t.diesel||0;
 $("toll").value=t.toll||0;
 $("other").value=t.other||0;
 $("salary").value=t.salary||0;
 $("advance").value=t.advance||0;
 $("km").value=t.km||0;
 window.scrollTo({top:0,behavior:"smooth"});
}

function deleteTrip(id){
 if(!confirm("Delete this trip permanently?"))return;
 data.trips=data.trips.filter(t=>t.id!==id);
 saveData();
 render();
}

/* PDF report */
function printReport(){
 const q=$("search").value.trim().toUpperCase();
 const list=data.trips.filter(t=>
  !q||[t.vehicle,t.driver,t.from,t.to,t.tripNo]
  .some(x=>String(x||"").toUpperCase().includes(q))
 ).sort((a,b)=>a.date.localeCompare(b.date));

 if(!list.length)return alert("No trips to print");

 const rent=list.reduce((s,t)=>s+Number(t.rent||0),0);
 const profit=list.reduce((s,t)=>s+Number(t.profit||0),0);

 const rows=list.map(t=>`
 <tr>
 <td>${esc(t.date)}</td>
 <td>${esc(t.vehicle)}</td>
 <td>${esc(t.tripNo||"")}</td>
 <td>${esc(t.driver)}</td>
 <td>${esc(t.from)} - ${esc(t.to)}</td>
 <td>${money(t.rent)}</td>
 <td>${money(t.diesel)}</td>
 <td>${money(t.toll)}</td>
 <td>${money(t.other)}</td>
 <td>${money(t.salary)}</td>
 <td>${money(t.advance)}</td>
 <td>${money(t.profit)}</td>
 </tr>`).join("");

 const w=window.open("","_blank");
 if(!w)return alert("Allow popup to print PDF");

 w.document.write(`
 <html><head><title>Sri Nandhi Trip Report</title>
 <style>
 body{font-family:Arial;padding:20px}
 h2{text-align:center}
 table{border-collapse:collapse;width:100%;font-size:11px}
 th,td{border:1px solid #777;padding:5px;text-align:center}
 th{background:#eee}
 </style></head><body>
 <h2>SRI NANDHI CARGO MOVERS</h2>
 <h3>VEHICLE TRIP REPORT</h3>
 <p>Total Trips: ${list.length} | Total Rent: ${money(rent)} | Total Net Profit: ${money(profit)}</p>
 <table>
 <thead><tr>
 <th>Date</th><th>Vehicle</th><th>Trip</th><th>Driver</th>
 <th>Route</th><th>Rent</th><th>Diesel</th><th>Toll</th>
 <th>Other</th><th>Salary</th><th>Advance</th><th>Profit</th>
 </tr></thead><tbody>${rows}</tbody></table>
 <script>window.onload=()=>window.print();<\/script>
 </body></html>`);
 w.document.close();
}

/* Backup */
function backupData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="sri-nandhi-trip-backup.json";
 a.click();
 URL.revokeObjectURL(a.href);
}

function restoreData(){
 const f=$("restoreFile").files[0];
 if(!f)return alert("Select backup file first");
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d.vehicles)||!Array.isArray(d.trips))
    throw new Error("Invalid backup file");
   if(!confirm("Replace current data with backup?"))return;
   data=d;
   saveData();
   render();
   alert("Backup restored successfully");
  }catch(e){alert("Invalid backup file");}
 };
 r.readAsText(f);
}

/* expose functions for HTML buttons */
window.addVehicle=addVehicle;
window.removeVehicle=removeVehicle;
window.saveTrip=saveTrip;
window.clearForm=clearForm;
window.editTrip=editTrip;
window.deleteTrip=deleteTrip;
window.renderHistory=renderHistory;
window.printReport=printReport;
window.backupData=backupData;
window.restoreData=restoreData;

/* local data first */
try{
 const saved=localStorage.getItem("sriNandhiTripBook");
 if(saved){
  const parsed=JSON.parse(saved);
  if(Array.isArray(parsed.vehicles)&&Array.isArray(parsed.trips))data=parsed;
 }
}catch(e){console.log(e)}

render();
connectFirebase();

</script>
</body>
</html>
